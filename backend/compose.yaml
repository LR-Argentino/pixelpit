services:
  postgres:
    image: 'postgres:18.4'
    environment:
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PW}'
    ports:
      - '5432:5432'
    volumes:
      - 'pgdata:/var/lib/postgresql'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s


volumes:
  pgdata:
