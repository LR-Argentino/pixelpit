spring:
  application:
    name: backend
  docker:
    compose:
      lifecycle-management: start_only
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
  modulith:
    events:
      completion-mode: archive

app:
  cors:
    allowed-origins:
      - "http://localhost:4200"
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
    allow-credentials: true
    max-age: 3600

server:
  port: 8081
