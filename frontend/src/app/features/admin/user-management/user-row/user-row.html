@let user = account();
<div class="flex min-w-0 flex-1 items-center gap-3">
  <app-avatar [name]="user.username" [size]="34" />
  <div class="min-w-0">
    <p
      class="m-0 truncate text-[15px] leading-[1.3] font-bold text-white"
      data-testid="user-row-username-text"
    >
      {{ user.username }}
    </p>
    <p
      class="m-0 mt-1 truncate text-[13px] leading-none text-ink-200"
      data-testid="user-row-email-text"
    >
      {{ user.email }}
    </p>
  </div>
</div>

<span
  class="inline-block flex-none rounded-[2px] border px-1.5 py-1 text-[10px] leading-none font-bold tracking-[.08em] uppercase"
  [class]="badgeClass()"
  data-testid="user-row-role-text"
>
  {{ labels[user.role] }}
</span>

<div class="relative flex flex-none justify-end">
  <button
    type="button"
    class="flex size-7 cursor-pointer items-center justify-center rounded-[2px] text-ink-200 transition-colors duration-150 hover:text-white focus-ring"
    [attr.aria-label]="'Aktionen für ' + user.username"
    aria-haspopup="menu"
    [attr.aria-expanded]="open()"
    (click)="open.set(!open())"
    data-testid="user-row-actions-button"
  >
    <app-icon name="ellipsis" [size]="18" />
  </button>

  @if (open()) {
    <div
      role="menu"
      [attr.aria-label]="'Rolle von ' + user.username"
      class="absolute top-8 right-0 z-20 min-w-[240px] rounded-[4px] border border-ink-500 bg-ink-650 p-1 shadow-[0_6px_20px_rgba(0,0,0,.6)]"
      data-testid="user-row-menu"
    >
      <p
        class="m-0 px-2.5 pt-[9px] pb-1.5 text-[11px] leading-none font-bold tracking-[.08em] text-ink-200 uppercase"
      >
        Rolle
      </p>
      @for (role of roles; track role) {
        <button
          type="button"
          role="menuitemradio"
          [attr.aria-checked]="role === user.role"
          [disabled]="self()"
          (click)="choose(role)"
          class="flex w-full cursor-pointer items-center gap-2.5 rounded-[3px] px-2.5 py-[9px] text-left text-sm leading-[1.2] text-white transition-colors duration-150 hover:bg-ink-600 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:bg-transparent"
          data-testid="user-row-role-item"
        >
          <span
            class="flex size-3.5 flex-none items-center justify-center rounded-full border border-ink-400 bg-ink-800 text-success"
          >
            @if (role === user.role) {
              <app-icon name="check" [size]="10" />
            }
          </span>
          {{ labels[role] }}
        </button>
      }
      @if (self()) {
        <p
          class="m-0 px-2.5 pt-1 pb-2 text-xs leading-[1.4] text-ink-200"
          data-testid="user-row-self-hint"
        >
          Deine eigene Rolle kannst du nicht ändern.
        </p>
      }
    </div>
  }
</div>
