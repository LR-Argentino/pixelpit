<app-hero />
<div class="px-11">
  <app-category-grid [categories]="categories()" [activeSlug]="kategorie()" />
  <div class="flex flex-wrap gap-12 pt-12 pb-16">
    <app-thread-list
      class="flex-[3_1_360px]"
      [threadPage]="threads.hasValue() ? threads.value() : undefined"
      [loading]="threads.isLoading()"
      [failed]="threads.error() !== undefined"
      [currentPage]="page()"
      (retry)="threads.reload()"
    />
    <!-- Beitragsvorschau folgt im nächsten Schritt -->
  </div>
</div>
