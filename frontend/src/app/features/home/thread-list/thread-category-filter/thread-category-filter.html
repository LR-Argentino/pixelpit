<a
  routerLink="/"
  [queryParams]="{ kategorie: null }"
  queryParamsHandling="merge"
  [attr.aria-current]="activeSlug() ? null : 'true'"
  data-testid="thread-category-filter-all-link"
  [class]="chipClasses(!activeSlug())"
>
  Alle
</a>
@for (category of categories(); track category.slug) {
  <a
    routerLink="/"
    [queryParams]="{ kategorie: category.slug }"
    queryParamsHandling="merge"
    [attr.aria-current]="category.slug === activeSlug() ? 'true' : null"
    data-testid="thread-category-filter-category-item"
    [class]="chipClasses(category.slug === activeSlug())"
  >
    {{ category.name }}
  </a>
}
