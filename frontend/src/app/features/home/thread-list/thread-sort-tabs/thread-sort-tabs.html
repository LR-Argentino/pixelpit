@for (option of options; track option.value) {
  <a
    routerLink="/"
    [queryParams]="option.queryParams"
    queryParamsHandling="merge"
    [attr.aria-current]="option.value === active() ? 'true' : null"
    data-testid="thread-sort-tabs-option-item"
    class="inline-flex h-[30px] items-center rounded-[3px] px-3 text-[13px] transition-colors duration-150 ease-out focus-ring"
    [class]="option.value === active() ? 'bg-ink-650 font-semibold text-white' : 'text-ink-100 hover:text-white'"
  >
    {{ option.label }}
  </a>
}
