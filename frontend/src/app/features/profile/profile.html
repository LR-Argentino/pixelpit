<div class="mx-auto max-w-[820px] px-11 pt-10 pb-16">
  <h1 class="mt-0 mb-8 text-2xl font-bold text-white" data-testid="profile-title-heading">
    Mein Profil
  </h1>

  @if (authService.currentUser(); as user) {
    <dl class="m-0 grid grid-cols-[max-content_1fr] gap-x-8 gap-y-4 text-[15px] leading-[1.4]">
      <dt class="text-xs font-bold tracking-[.07em] text-ink-100 uppercase">Benutzername</dt>
      <dd class="m-0 text-white" data-testid="profile-username-text">{{ user.username }}</dd>

      <dt class="text-xs font-bold tracking-[.07em] text-ink-100 uppercase">E-Mail</dt>
      <dd class="m-0 text-white" data-testid="profile-email-text">{{ user.email }}</dd>

      <dt class="text-xs font-bold tracking-[.07em] text-ink-100 uppercase">Threads</dt>
      <dd class="m-0 text-white" data-testid="profile-thread-count-text">{{ user.threadCount }}</dd>

      <dt class="text-xs font-bold tracking-[.07em] text-ink-100 uppercase">Posts</dt>
      <dd class="m-0 text-white" data-testid="profile-post-count-text">{{ user.postCount }}</dd>
    </dl>

    <app-delete-account />
  } @else {
    <div class="rounded-[3px] border border-dashed border-ink-500 px-6 py-10 text-center">
      <p class="m-0 text-[15px] leading-[1.4] text-ink-100" data-testid="profile-guest-hint">
        Dein Profil siehst du, sobald du angemeldet bist
      </p>
      <div class="mt-5 flex justify-center">
        <a
          appButton
          variant="secondary"
          size="sm"
          routerLink="/anmelden"
          data-testid="profile-login-link"
        >
          Anmelden
        </a>
      </div>
    </div>
  }
</div>
