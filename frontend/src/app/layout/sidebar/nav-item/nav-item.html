<a
  [routerLink]="link().path"
  [queryParams]="link().queryParams"
  routerLinkActive="!bg-ink-650 font-semibold !text-white"
  [routerLinkActiveOptions]="exactMatch"
  ariaCurrentWhenActive="page"
  [attr.title]="link().locked ? 'Nach der Anmeldung verfügbar' : null"
  data-testid="nav-item-link"
  class="flex h-10 items-center gap-3 rounded-[4px] px-3 text-sm transition-colors duration-150 ease-out hover:bg-white/[.04] focus-ring"
  [class]="link().locked ? 'text-ink-200' : 'text-ink-100 hover:text-white'"
>
  <app-icon [name]="link().icon" [size]="17" />
  <span class="flex-1 truncate">{{ link().label }}</span>
  @if (link().locked) {
    <app-icon name="lock" [size]="13" />
    <span class="sr-only" data-testid="nav-item-locked-hint">(nur für Mitglieder)</span>
  }
</a>
