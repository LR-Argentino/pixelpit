<div>
  <h2
    [id]="headingId()"
    class="m-0 text-[26px] leading-[1.15] font-bold tracking-[-.02em] text-white"
    data-testid="section-heading-title-heading"
  >
    {{ title() }}
  </h2>
  @if (subtitle(); as subtitle) {
    <p class="mt-2 mb-0 text-[13px] leading-[1.4] text-ink-100" data-testid="section-heading-subtitle-text">{{ subtitle }}</p>
  }
</div>
<ng-content />
